name: Build MacroRecorder.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pynput pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --name MacroRecorder macro_recorder.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MacroRecorder
          path: dist/MacroRecorder.exe
